<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0F1115"/>
  <title>ChickenEgg — Abonnement</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#0F1115;color:#F0F2F5;
      padding:max(24px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
      line-height:1.5;
    }
    .wrap{max-width:420px;margin:0 auto}
    h1{font-size:22px;font-weight:800;margin-bottom:12px}
    p{color:#B8BEC9;font-size:15px;margin-bottom:16px}
    a.ce-btn{
      display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;
      background:#60A5FA;color:#0F1115;font-weight:800;text-decoration:none;border-radius:12px;
      margin-top:12px;font-size:16px;
    }
    a.ce-sec{display:block;text-align:center;margin-top:16px;color:#60A5FA;font-weight:600;font-size:15px;text-decoration:none;padding:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ChickenEgg Pro</h1>
    <p>Met Pro scan je onbeperkt en krijg je toegang tot stap-fotoverificatie en diepere begeleiding. Open de app om je abonnement te kiezen.</p>
    <a class="ce-btn" href="/">Open de app</a>
    <a class="ce-sec" href="/privacy">Privacy</a>
  </div>
</body>
</html>
