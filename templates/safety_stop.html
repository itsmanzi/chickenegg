<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#1A0505"/>
  <title>ChickenEgg — Veiligheid</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;min-height:100dvh}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
      display:flex;flex-direction:column;align-items:center;
    }
    body.ce-tier-caution{
      background:#1A1508;color:#F0F2F5;
    }
    body.ce-tier-danger,
    body.ce-tier-emergency{
      background:#1A0505;color:#F0F2F5;
    }
    .ce-safety-wrap{width:100%;max-width:480px;margin:auto 0;flex:1;display:flex;flex-direction:column;justify-content:center}
    .ce-safety-ico{margin:0 auto 20px;display:block}
    body.ce-tier-caution .ce-safety-ico{color:#FBB040}
    body.ce-tier-danger .ce-safety-ico,
    body.ce-tier-emergency .ce-safety-ico{color:#EF4444}
    h1{font-size:24px;font-weight:900;letter-spacing:-0.02em;text-align:center;margin-bottom:12px;line-height:1.15}
    body.ce-tier-caution h1{color:#FBB040}
    body.ce-tier-danger h1,
    body.ce-tier-emergency h1{color:#F87171}
    .ce-safety-sub{font-size:15px;line-height:1.5;color:#B8BEC9;text-align:center;margin-bottom:22px}
    .ce-tel-list{width:100%;display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
    .ce-tel-link{
      display:flex;align-items:center;justify-content:center;
      min-height:52px;padding:12px 16px;border-radius:12px;text-decoration:none;
      font-size:15px;font-weight:700;font-family:inherit;
      background:#2A0808;border:1px solid rgba(239,68,68,0.25);color:#F87171;
    }
    .ce-tel-link:active{opacity:0.9}
    .ce-pro-line{
      font-size:15px;line-height:1.5;color:#B8BEC9;text-align:center;margin-bottom:18px;
      padding:12px;border-radius:12px;background:rgba(255,255,255,0.04);
    }
    .ce-safety-close{
      width:100%;min-height:52px;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;
      background:#374151;color:#F0F2F5;cursor:pointer;margin-top:8px;
    }
    .ce-safety-close:active{transform:scale(0.99)}
    .ce-safety-back{
      display:block;margin-top:14px;text-align:center;font-size:15px;font-weight:600;color:#60A5FA;
      text-decoration:none;padding:12px;min-height:44px;line-height:20px;
    }
  </style>
</head>
<body class="ce-tier-{{ tier|default('danger') }}">
  <div class="ce-safety-wrap">
    <svg class="ce-safety-ico" width="64" height="64" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2L2 20h20L12 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1 id="ce-safety-h1">Stop. Ga niet verder.</h1>
    <p class="ce-safety-sub" id="ce-safety-msg"></p>
    <div class="ce-tel-list" id="ce-safety-tels" style="display:none">
      <a class="ce-tel-link" href="tel:112">112 — Hulpdiensten</a>
      <a class="ce-tel-link" href="tel:08009009">0800-9009 — Gasleiding storing</a>
      <a class="ce-tel-link" href="tel:08000188">0800-0188 — Waterleiding storing</a>
    </div>
    <p class="ce-pro-line" id="ce-safety-pro" style="display:none">Schakel een erkend vakbedrijf in voor deze klus.</p>
    <button type="button" class="ce-safety-close" id="ce-safety-done">Sluit de klus</button>
    <a href="/" class="ce-safety-back" id="ce-safety-back" style="display:none">Terug naar de app</a>
  </div>
  <script>
(function(){
  var tier={{ tier|tojson }}||'danger';
  var serverMsg={{ message|tojson }}||'';
  var body=document.body;
  body.classList.remove('ce-tier-caution','ce-tier-danger','ce-tier-emergency');
  body.classList.add('ce-tier-'+tier);
  var msgEl=document.getElementById('ce-safety-msg');
  var h1=document.getElementById('ce-safety-h1');
  var tels=document.getElementById('ce-safety-tels');
  var pro=document.getElementById('ce-safety-pro');
  var back=document.getElementById('ce-safety-back');
  var txt=serverMsg;
  try{
    var ss=sessionStorage.getItem('ce_safety_msg');
    if(!txt&&ss)txt=ss;
  }catch(e){}
  if(msgEl)msgEl.textContent=txt||'We zien een risico. Stop met deze klus en vraag hulp als dat nodig is.';
  if(tier==='caution'){
    if(h1)h1.textContent='Even opletten';
    if(tels)tels.style.display='none';
    if(pro){pro.style.display='block';pro.textContent='Wees voorzichtig en twijfel je? Schakel een vakman in.';}
    if(back)back.style.display='block';
  }else if(tier==='emergency'){
    if(tels)tels.style.display='flex';
    if(pro)pro.style.display='none';
  }else{
    if(tels)tels.style.display='none';
    if(pro)pro.style.display='block';
  }
  function goHome(){
    try{sessionStorage.removeItem('ce_safety_msg');}catch(e){}
    location.href='/?ce_reset=1';
  }
  var btn=document.getElementById('ce-safety-done');
  if(btn)btn.addEventListener('click',goHome);
})();
  </script>
</body>
</html>
