<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Mockup — Transparent Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0F1115;
    --surface-1:#181A1F;
    --surface-2:#22252B;
    --border:rgba(255,255,255,0.10);
    --t1:#F0F2F5;
    --t2:#B8BEC9;
    --t3:#9CA3AF;
    --accent:#60A5FA;
    --gold:#F59E0B;
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-top:env(safe-area-inset-top,0px);
  }
  html,body{
    height:100%;min-height:100dvh;overflow:hidden;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:#000;color:var(--t1);
  }

  /* ── Fake camera background ── */
  .fake-cam{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 38%,rgba(255,255,255,.04) 0%,transparent 60%),
      linear-gradient(180deg,#0a0d10 0%,#111318 30%,#0d1017 60%,#090b0e 100%);
    overflow:hidden;
  }
  /* Fake scene objects for realism */
  .fake-cam::before{
    content:'';
    position:absolute;
    left:50%;top:38%;transform:translate(-50%,-50%);
    width:180px;height:220px;
    border-radius:12px;
    background:linear-gradient(160deg,#2a2d35 0%,#1a1c22 60%,#141619 100%);
    box-shadow:0 8px 40px rgba(0,0,0,.6);
  }
  .fake-cam::after{
    content:'🔧';
    position:absolute;
    left:50%;top:38%;transform:translate(-50%,-50%);
    font-size:64px;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
  }

  /* ── Camera finder corners ── */
  .finder{
    position:absolute;
    left:50%;top:50%;transform:translate(-50%,-55%);
    width:200px;height:240px;
  }
  .finder-corner{
    position:absolute;width:22px;height:22px;
    border-color:rgba(255,255,255,.6);border-style:solid;
  }
  .finder-corner.tl{top:0;left:0;border-width:2px 0 0 2px;border-radius:4px 0 0 0}
  .finder-corner.tr{top:0;right:0;border-width:2px 2px 0 0;border-radius:0 4px 0 0}
  .finder-corner.bl{bottom:0;left:0;border-width:0 0 2px 2px;border-radius:0 0 0 4px}
  .finder-corner.br{bottom:0;right:0;border-width:0 2px 2px 0;border-radius:0 0 4px 0}

  /* ── Labels in camera ── */
  .cam-hint{
    position:absolute;
    top:calc(var(--safe-top) + 60px);
    left:0;right:0;
    text-align:center;
  }
  .cam-hint-pill{
    display:inline-block;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.14);
    padding:7px 16px;
    border-radius:20px;
    font-size:13px;font-weight:600;
    color:rgba(255,255,255,.9);
    letter-spacing:.3px;
  }
  .cat-pill{
    position:absolute;
    top:calc(var(--safe-top) + 60px);
    left:16px;
    background:rgba(96,165,250,.2);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(96,165,250,.4);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;font-weight:700;
    color:#93C5FD;
    display:flex;align-items:center;gap:5px;
  }
  .cat-pill-dot{
    width:6px;height:6px;border-radius:50%;
    background:#60A5FA;
    animation:catPulse 2s ease-in-out infinite;
  }
  @keyframes catPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

  /* ── BEFORE version (with black bar) ── */
  .before-label,.after-label{
    position:absolute;top:50%;transform:translateY(-50%);
    padding:4px 10px;border-radius:6px;
    font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  }

  /* ── DOCK: TRANSPARENT version (the new design) ── */
  .cam-dock{
    position:absolute;
    left:0;right:0;bottom:0;
    z-index:100;
    padding:20px 24px calc(var(--safe-bottom) + 24px);
    /* NO background — fully transparent */
    background:transparent;
    display:flex;align-items:center;justify-content:center;gap:0;
  }

  /* Side pills */
  .dock-pill{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:22px;
    padding:10px 20px;
    font-size:13px;font-weight:700;
    color:rgba(255,255,255,.85);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
    -webkit-user-select:none;user-select:none;
  }
  .dock-pill:disabled{opacity:.3;pointer-events:none}

  /* Center egg scan button */
  .dock-center{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}

  .snap-wrap{
    position:relative;width:72px;height:80px;
    display:flex;align-items:center;justify-content:center;
  }

  /* Pulsing rings */
  .snap-ring{
    position:absolute;inset:0;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    border:1.5px solid rgba(96,165,250,.35);
    animation:ringPulse 2.4s ease-in-out infinite;
  }
  .snap-ring:nth-child(2){
    inset:-8px;
    border-color:rgba(96,165,250,.18);
    animation-delay:.6s;
  }
  .snap-ring:nth-child(3){
    inset:-16px;
    border-color:rgba(96,165,250,.09);
    animation-delay:1.2s;
  }
  @keyframes ringPulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:.3;transform:scale(1.04)}}

  /* The egg shutter */
  .snap-shutter{
    position:relative;z-index:5;
    width:72px;height:80px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:
      radial-gradient(circle 6px at 50% 50%, #0a0a0a 0%, transparent 100%),
      radial-gradient(circle 24px at 50% 50%, #1a1a1a 0%, #111 60%, transparent 100%),
      radial-gradient(circle 36px at 50% 50%, #283040 0%, #1a2030 60%, transparent 100%),
      radial-gradient(circle 72px at 50% 50%, #60A5FA 0%, #3B82F6 40%, #1d4ed8 100%);
    box-shadow:
      0 0 0 2.5px rgba(255,255,255,.22),
      0 0 0 4px rgba(96,165,250,.35),
      0 8px 28px rgba(96,165,250,.5),
      inset 0 2px 4px rgba(255,255,255,.25),
      inset 0 -2px 6px rgba(0,0,0,.4);
    cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s ease;
    -webkit-user-select:none;user-select:none;
  }
  .snap-shutter:active{
    transform:scale(.93);
    box-shadow:
      0 0 0 2.5px rgba(255,255,255,.22),
      0 0 0 4px rgba(96,165,250,.55),
      0 4px 18px rgba(96,165,250,.6),
      inset 0 2px 4px rgba(255,255,255,.15),
      inset 0 -2px 6px rgba(0,0,0,.5);
  }

  /* Scan label */
  .slbl{
    font-size:9px;font-weight:800;
    color:rgba(255,255,255,.7);
    letter-spacing:2.5px;text-transform:uppercase;
    text-shadow:0 1px 4px rgba(0,0,0,.7);
  }

  /* ── Split comparison panel ── */
  .compare{
    position:absolute;inset:0;
    display:flex;
    pointer-events:none;
    z-index:200;
  }
  .compare-half{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:calc(var(--safe-bottom) + 30px);
    pointer-events:auto;
  }
  .compare-half--before{
    border-right:1.5px solid rgba(255,255,255,.2);
  }

  /* BEFORE dock — dark gradient */
  .dock-before{
    width:100%;
    padding:20px 12px calc(var(--safe-bottom) + 24px);
    background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.3) 30%,rgba(0,0,0,.9) 100%);
    display:flex;justify-content:center;
  }

  /* AFTER dock — transparent */
  .dock-after{
    width:100%;
    padding:20px 12px calc(var(--safe-bottom) + 24px);
    background:transparent;
    display:flex;justify-content:center;
  }

  .compare-tag{
    position:absolute;
    bottom:calc(var(--safe-bottom) + 150px);
    font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    padding:5px 12px;border-radius:8px;
  }
  .tag-before{
    left:8px;
    background:rgba(239,68,68,.2);
    border:1px solid rgba(239,68,68,.4);
    color:#FCA5A5;
  }
  .tag-after{
    right:8px;
    background:rgba(52,211,153,.15);
    border:1px solid rgba(52,211,153,.35);
    color:#6EE7B7;
  }

  /* ── Mockup banner ── */
  .mockup-banner{
    position:fixed;top:0;left:0;right:0;z-index:999;
    background:rgba(245,158,11,.18);
    border-bottom:1px solid rgba(245,158,11,.35);
    backdrop-filter:blur(8px);
    padding:5px 16px;
    text-align:center;
    font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:var(--gold);
  }

  /* The mini egg for comparison panels */
  .mini-egg{
    width:60px;height:66px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle 5px at 50% 50%, #0a0a0a 0%, transparent 100%),
      radial-gradient(circle 20px at 50% 50%, #1a1a1a 0%, #111 60%, transparent 100%),
      radial-gradient(circle 60px at 50% 50%, #60A5FA 0%, #3B82F6 40%, #1d4ed8 100%);
    box-shadow:
      0 0 0 2px rgba(255,255,255,.2),
      0 6px 20px rgba(96,165,250,.45),
      inset 0 2px 3px rgba(255,255,255,.2);
  }
</style>
</head>
<body>

<div class="mockup-banner">📐 MOCKUP — Dock vergelijking</div>

<!-- Fake camera scene -->
<div class="fake-cam">
  <div class="finder">
    <div class="finder-corner tl"></div>
    <div class="finder-corner tr"></div>
    <div class="finder-corner bl"></div>
    <div class="finder-corner br"></div>
  </div>
</div>

<!-- Category pill in camera -->
<div class="cat-pill" style="top:calc(env(safe-area-inset-top,0px) + 58px)">
  <div class="cat-pill-dot"></div>
  Meubels
</div>

<!-- Hint label -->
<div class="cam-hint" style="top:calc(env(safe-area-inset-top,0px) + 58px);left:auto;right:16px;text-align:right">
  <div class="cam-hint-pill" style="font-size:11px;padding:5px 12px">Richt op object</div>
</div>

<!-- Comparison tags -->
<div style="position:absolute;z-index:201">
  <div class="compare-tag tag-before">Voor</div>
  <div class="compare-tag tag-after">Na</div>
</div>

<!-- Side-by-side comparison -->
<div class="compare">

  <!-- LEFT: BEFORE (black bar) -->
  <div class="compare-half compare-half--before">
    <div class="dock-before">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <div class="mini-egg"></div>
        <div style="font-size:8px;font-weight:800;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase">SCAN</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: AFTER (transparent) -->
  <div class="compare-half">
    <div class="dock-after">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <!-- Full egg with rings for the "after" side -->
        <div style="position:relative;width:72px;height:80px;display:flex;align-items:center;justify-content:center">
          <div class="snap-ring"></div>
          <div class="snap-ring"></div>
          <div class="snap-ring"></div>
          <div class="snap-shutter" onclick="this.style.transform='scale(.93)';setTimeout(()=>this.style.transform='',200)"></div>
        </div>
        <div class="slbl">SCAN</div>
      </div>
    </div>
  </div>

</div>

<!-- Info card at top -->
<div style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 40px);left:50%;transform:translateX(-50%);z-index:202;white-space:nowrap">
  <div style="background:rgba(0,0,0,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 16px;text-align:center;margin-top:32px">
    <div style="font-size:12px;font-weight:700;color:#F0F2F5;margin-bottom:2px">Dock achtergrond</div>
    <div style="font-size:10px;color:#9CA3AF">Links = zwarte balk &nbsp;|&nbsp; Rechts = transparant</div>
  </div>
</div>

</body>
</html>
