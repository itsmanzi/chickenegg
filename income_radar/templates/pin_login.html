<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Income Radar — unlock</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0c0f;
      color: #e8eaef;
    }
    .card {
      width: min(420px, 92vw);
      padding: 22px; border-radius: 14px;
      border: 1px solid #252a36;
      background: linear-gradient(180deg, #151821, #12141d);
    }
    h1 { font-size: 1.05rem; margin: 0 0 6px; }
    p { color: #9aa3b2; font-size: 0.9rem; line-height: 1.45; margin: 0 0 14px; }
    label { display: block; font-size: 0.8rem; color: #9aa3b2; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border-radius: 10px; border: 1px solid #252a36;
      background: #0e1118; color: #e8eaef;
    }
    button {
      margin-top: 14px; width: 100%; padding: 11px;
      border: 0; border-radius: 11px; font-weight: 700;
      background: linear-gradient(180deg, #64e3b0, #38c591); color: #07110c;
      cursor: pointer;
    }
    .err {
      background: rgba(255,80,80,0.12); border: 1px solid rgba(255,80,80,0.35);
      color: #ffb4b4; padding: 10px 12px; border-radius: 10px; font-size: 0.88rem;
      margin-bottom: 12px;
    }
    code { font-size: 0.82rem; color: #cfe9ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Unlock Income Radar</h1>
    <p>This instance requires a PIN. Set <code>INCOME_RADAR_PIN</code> in your environment if you have not already.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next or '' }}"/>
      <label for="pin">PIN</label>
      <input id="pin" name="pin" type="password" autocomplete="current-password" autofocus required/>
      <button type="submit">Unlock</button>
    </form>
  </div>
</body>
</html>
